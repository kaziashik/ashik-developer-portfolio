<!doctype html>
<html lang="en" data-theme="lightMode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          localStorage.removeItem('theme')
          localStorage.removeItem('portfolio-theme')
          var t = localStorage.getItem('portfolio-theme-v2')
          if (t !== 'lightMode' && t !== 'darkMode') t = 'lightMode'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'lightMode')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Kazi Ashik — MERN Stack Developer</title>
    <meta name="description" content="MERN Stack developer building modern, responsive, and scalable web applications with React, Next.js, Node.js, and Prisma." />
  </head>
  <body class="bg-base-100 text-base-content">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
